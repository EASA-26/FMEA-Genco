<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FMEA Report</title>
  <meta name="description" content="FMEA Report: Failure Mode &amp; Effects Analysis. This page opens the app.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://fmea-genco.onrender.com/">
  <link rel="canonical" href="https://fmea-genco.onrender.com/">
  <style>
    :root { --bg: #f4f6fa; --card: #ffffff; --text: #0b1b3a; --muted: #4a5878; --accent: #1652d9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1324; --card: #13203a; --text: #eef2fb; --muted: #a9b6d3; --accent: #7aa7ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 440px; width: 100%; background: var(--card); border-radius: 12px; padding: 28px 24px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    a.open {
      display: inline-block; padding: 10px 18px; border-radius: 8px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    }
    a.open:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    .note { margin: 20px 0 0; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>FMEA Report</h1>
    <p class="sub">Failure Mode &amp; Effects Analysis</p>
    <p>Opening the app&hellip;</p>
    <p><a class="open" href="https://fmea-genco.onrender.com/">Open the FMEA Report app</a></p>
    <p class="note">If nobody has used the app for a while, it can take up to a minute to wake up.</p>
  </main>
  <script>window.location.replace("https://fmea-genco.onrender.com/");</script>
</body>
</html>
